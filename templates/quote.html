<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall Display - Quote</title>
    <style>
        :root {
            --bg: #10151d;
            --card: #1c2431;
            --border: #30363d;
            --accent: #58a6ff;
            --gold: #FFD700;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); 
            color: white; 
            text-align: center; 
            margin: 0; 
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .top-nav {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .top-nav a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.95rem;
            padding: 8px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .quote-container {
            max-width: 900px;
            padding: 40px 20px;
        }
        .quote {
            font-size: 42px;
            font-style: italic;
            line-height: 1.5;
            margin: 30px 0;
            color: var(--gold);
        }
        .controls {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .notif-button {
            background: #238636;
            color: white;
            border: 1px solid rgba(240, 246, 252, 0.1);
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .notif-button:hover {
            background: #2ea043;
        }
        .notif-button.secondary {
            background: #21262d;
            border-color: var(--border);
        }
        .notif-button.secondary:hover {
            background: #30363d;
        }
        .notif-button.off {
            background: #da3633;
        }
        .notif-button.off:hover {
            background: #b62324;
        }
        .notif-status {
            width: 100%;
            margin-top: 12px;
            font-size: 14px;
            color: #8b949e;
        }
        @media (max-width: 600px) {
            .quote { font-size: 28px; }
            .top-nav { position: static; margin-bottom: 20px; }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="/">← Dashboard Control Panel</a>
    </div>

    <div class="quote-container">
        <div class="quote" id="quoteText">
            {{ quote }}
        </div>
        <div class="controls">
            <button class="notif-button secondary" onclick="nextQuote()">
                🎲 Next Quote
            </button>
            <button class="notif-button" id="notifBtn" onclick="toggleNotifications()">
                🔔 Enable Notifications
            </button>
            <button class="notif-button" id="sendBtn" onclick="sendQuoteNotification()" style="display:none;">
                📬 Push Notification Now
            </button>
            <div class="notif-status" id="notifStatus">Notifications: Disabled</div>
        </div>
    </div>

    <script>
        function updateNotificationUI() {
            const btn = document.getElementById('notifBtn');
            const sendBtn = document.getElementById('sendBtn');
            const status = document.getElementById('notifStatus');
            
            if (!('Notification' in window)) {
                status.textContent = 'Notifications: Not supported';
                btn.disabled = true;
                return;
            }
            
            if (Notification.permission === 'granted') {
                btn.textContent = '🔔 Disable Notifications';
                btn.classList.add('off');
                sendBtn.style.display = 'inline-block';
                status.textContent = 'Notifications: Enabled ✓';
            } else {
                btn.textContent = '🔔 Enable Notifications';
                btn.classList.remove('off');
                sendBtn.style.display = 'none';
                status.textContent = 'Notifications: Disabled';
            }
        }

        async function nextQuote() {
            try {
                const res = await fetch('/api/quotes/random', { method: 'POST' });
                const data = await res.json();
                if (data.quote) {
                    document.getElementById('quoteText').textContent = data.quote;
                }
            } catch (err) {
                console.error(err);
            }
        }

        function sendQuoteNotification() {
            fetch('/api/send_quote_notification')
                .then(res => res.json())
                .then(data => {
                    new Notification(data.title, {
                        body: data.quote,
                        icon: data.icon
                    });
                })
                .catch(err => console.log('Notification request failed:', err));
        }

        function toggleNotifications() {
            if (!('Notification' in window)) {
                alert('Notifications not supported in this browser');
                return;
            }

            if (Notification.permission === 'granted') {
                const btn = document.getElementById('notifBtn');
                btn.textContent = '🔔 Enable Notifications';
                btn.classList.remove('off');
                document.getElementById('sendBtn').style.display = 'none';
                document.getElementById('notifStatus').textContent = 'Notifications: Disabled';
                localStorage.setItem('notificationsDisabled', 'true');
            } else if (Notification.permission !== 'denied') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        new Notification('Wall Display', {
                            body: 'Quote notifications enabled!',
                            icon: '📜'
                        });
                        sendQuoteNotification();
                    }
                    updateNotificationUI();
                });
            } else {
                alert('Notification permission was denied.\n\nTo enable notifications:\n1. Click the lock icon in the address bar\n2. Find "Notifications"\n3. Change to "Allow"\n4. Refresh the page');
            }
        }

        window.addEventListener('load', updateNotificationUI);

        setInterval(function() {
            if ('Notification' in window && 
                Notification.permission === 'granted' && 
                localStorage.getItem('notificationsDisabled') !== 'true') {
                sendQuoteNotification();
            }
        }, 3600000);
    </script>
</body>
</html>
